<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Oil Git · 看清 AI 改了什么</title>
  <desc id="desc">只读的 Git 可视化桌面工具。右侧用真实验收仓库的合并提交和 tasks.ts 差异片段，简化展示主分支与功能分支的关系。macOS 与 Windows 的真实窗口截图和使用方法见下方 README。</desc>
  <rect width="1200" height="460" rx="24" fill="#21252b"/>
  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(64 44)" fill="none" stroke="#98c379" stroke-width="3" stroke-linecap="round">
      <path d="M10 9v29m0-14c17 0 26-7 26-17"/>
      <circle cx="10" cy="6" r="5" fill="#21252b"/>
      <circle cx="10" cy="40" r="5" fill="#21252b"/>
      <circle cx="36" cy="5" r="5" fill="#21252b"/>
    </g>
    <text x="124" y="73" font-size="22" fill="#abb2bf">Git 可视化桌面工具</text>
    <text x="59" y="194" font-size="100" font-weight="700" letter-spacing="-5" fill="#d7dae0">Oil Git</text>
    <text x="64" y="258" font-size="36" font-weight="500" fill="#d7dae0">看清 AI 改了什么。</text>
    <text x="64" y="303" font-size="22" fill="#abb2bf">分支、提交、文件差异，一个窗口。</text>
    <g id="platforms" transform="translate(64 367)">
      <rect width="226" height="46" rx="12" fill="#2f343e"/>
      <text x="20" y="30" font-size="22" fill="#d7dae0">macOS · Windows</text>
      <circle cx="266" cy="23" r="5" fill="#98c379"/>
      <text x="282" y="30" font-size="22" fill="#abb2bf">只读 · 本地</text>
    </g>
  </g>
  <g id="repository" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="576" y="32" width="592" height="396" rx="18" fill="#282c34"/>
    <text x="620" y="76" font-size="20" fill="#abb2bf">提交之间的关系</text>
    <g id="commit-edges" fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M626 119v56c0 32 0 48 0 76v117" stroke="#98c379"/>
      <path d="M626 175c0 34 46 40 46 76v46c0 40-46 36-46 71" stroke="#c678dd"/>
    </g>
    <g id="commit-nodes" stroke-width="3">
      <circle cx="626" cy="119" r="9" fill="#98c379" stroke="#98c379"/>
      <circle cx="626" cy="175" r="9" fill="#282c34" stroke="#98c379"/>
      <circle cx="626" cy="251" r="9" fill="#282c34" stroke="#98c379"/>
      <circle cx="672" cy="251" r="9" fill="#c678dd" stroke="#c678dd"/>
      <circle cx="672" cy="297" r="9" fill="#282c34" stroke="#c678dd"/>
      <circle cx="626" cy="368" r="9" fill="#282c34" stroke="#98c379"/>
    </g>
    <g id="head-label">
      <text x="706" y="126" font-size="24" font-weight="500" fill="#d7dae0">更新项目的使用说明</text>
      <rect x="1010" y="102" width="118" height="32" rx="7" fill="#33402f"/>
      <text x="1027" y="124" font-size="18" font-family="ui-monospace, Menlo, monospace" fill="#98c379">main HEAD</text>
    </g>
    <text x="706" y="182" font-size="24" fill="#d7dae0">合并任务列表功能</text>
    <g id="selected-commit">
      <rect x="696" y="219" width="448" height="181" rx="12" fill="#2f343e"/>
      <text x="718" y="255" font-size="24" font-weight="500" fill="#d7dae0">完善任务的筛选与空状态</text>
      <text x="718" y="284" font-size="18" font-family="ui-monospace, Menlo, monospace" fill="#c678dd">feature/task-list</text>
      <text x="718" y="319" font-size="18" fill="#abb2bf">tasks.ts · 差异片段</text>
      <path d="M718 338h404" stroke="#443239" stroke-width="32"/>
      <text x="730" y="345" font-size="20" font-family="ui-monospace, Menlo, 'PingFang SC', monospace" fill="#efc0c4">− "检查 Agent 的修改"];</text>
      <path d="M718 375h404" stroke="#334334" stroke-width="32"/>
      <text x="730" y="382" font-size="20" font-family="ui-monospace, Menlo, 'PingFang SC', monospace" fill="#cde6b6">+ …, "提交可用版本"];</text>
    </g>
  </g>
</svg>
